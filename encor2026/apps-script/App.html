<script>
/**
 * ENCOR 2026 — single-page client.
 * Flow: Day → Station / OSCE → Round / Room → Participant → Form → Submit.
 * All writes go through an offline-tolerant outbox (localStorage) and are
 * retried until the server confirms. The server re-checks every permission.
 */
(function () {
  'use strict';

  // ================================================================
  // 0. State + utilities
  // ================================================================
  var S = { token: '', me: null, access: null, ref: null, cfg: {}, idx: {}, stack: [], charts: [], timers: [], clockOffset: 0,
    outbox: [], rejected: [], syncing: false, dash: { tab: 'overview', filters: {}, data: null } };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function fmtPct(v) { return v === null || v === undefined || isNaN(v) ? '—' : (Math.round(v * 10) / 10) + '%'; }
  function fmtNum(v, d) { return v === null || v === undefined || isNaN(v) ? '—' : String(Math.round(v * Math.pow(10, d || 1)) / Math.pow(10, d || 1)); }
  function now() { return Date.now() + S.clockOffset; }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    $('#toastRoot').appendChild(t); setTimeout(function () { t.remove(); }, 3200);
  }
  function muscatMs(ymd, hhmm) {
    if (!ymd) return NaN; var d = ymd.split('-').map(Number), t = (hhmm || '00:00').split(':').map(Number);
    return Date.UTC(d[0], d[1] - 1, d[2], t[0] - 4, t[1] || 0);
  }
  function startOf(range) { var m = /(\d{1,2})[:.](\d{2})/.exec(range || ''); return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : ''; }
  function fmtDate(ymd) {
    if (!ymd) return ''; var d = ymd.split('-').map(Number);
    var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d[1] - 1];
    return d[2] + ' ' + mon + ' ' + d[0];
  }

  // ================================================================
  // 1. RPC
  // ================================================================
  function rpc(action, payload) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) { reject(new Error('Offline')); return; }
      google.script.run
        .withSuccessHandler(function (res) { resolve(res); })
        .withFailureHandler(function (err) { reject(err || new Error('Network error')); })
        .api(S.token, action, JSON.parse(JSON.stringify(payload || {})));   // only plain JSON crosses the bridge
    });
  }
  /** rpc for reads: surfaces server errors as a rejected promise with a message. */
  function get(action, payload) {
    return rpc(action, payload).then(function (r) {
      if (!r.ok) { var e = new Error(r.error + (r.errors && r.errors.length ? '\n• ' + r.errors.join('\n• ') : '')); e.code = r.code; throw e; }
      return r.data;
    });
  }

  /** Network-tolerant read: on a transport failure (no server reply) resolve with `fallback` flagged offline. */
  function getOr(action, payload, fallback) {
    return get(action, payload).catch(function (e) { if (e && e.code) throw e; var f = Object.assign({}, fallback); f.__offline = true; return f; });
  }
  var OFFLINE_BANNER = '<div class="banner warn small">Offline — showing what is stored on this device. Entries are queued and sent when the connection returns.</div>';

  // ================================================================
  // 2. Outbox (offline tolerance + idempotent retries)
  // ================================================================
  function loadOutbox() { S.outbox = LS.get('encor_outbox', []); S.rejected = LS.get('encor_rejected', []); }
  function saveOutbox() { LS.set('encor_outbox', S.outbox); LS.set('encor_rejected', S.rejected); renderSync(); }
  /** Queue a write. payload.request_id makes retries safe. */
  function enqueue(action, payload, label) {
    payload.request_id = payload.request_id || uuid();
    S.outbox.push({ action: action, payload: payload, label: label || action, queued: Date.now() });
    saveOutbox(); flush();
    return payload.request_id;
  }
  function pendingFor(pred) { return S.outbox.some(function (o) { return pred(o.payload, o.action); }); }
  function flush() {
    if (S.syncing || !S.outbox.length) { renderSync(); return; }
    S.syncing = true; renderSync();
    var item = S.outbox[0];
    rpc(item.action, item.payload).then(function (res) {
      S.outbox.shift();
      if (!res.ok) {
        if (res.code === 'NOT_SIGNED_IN') { S.outbox.unshift(item); S.syncing = false; saveOutbox(); return; }
        S.rejected.push({ label: item.label, error: res.error, errors: res.errors || [], at: Date.now(), action: item.action, payload: item.payload });
        showRejected();
      } else if (item.onDone) item.onDone(res.data);
      S.syncing = false; saveOutbox();
      if (S.outbox.length) flush(); else refreshCurrent();
    }, function () {
      S.syncing = false; renderSync();
      setTimeout(flush, 5000);       // network error: keep and retry
    });
  }
  function renderSync() {
    var b = $('#syncBadge'); if (!b) return;
    if (S.rejected.length) { b.className = 'badge-sync err'; b.textContent = 'Rejected (' + S.rejected.length + ')'; }
    else if (S.outbox.length) { b.className = 'badge-sync wait'; b.textContent = (S.syncing ? 'Syncing… ' : 'Waiting to sync ') + '(' + S.outbox.length + ')'; }
    else { b.className = 'badge-sync ok'; b.textContent = 'Saved to sheet'; }
  }
  function showRejected() {
    if (!S.rejected.length) {
      modal('<h2>Sync status</h2><p>' + (S.outbox.length ? S.outbox.length + ' item(s) waiting to sync. They are kept on this device and retried automatically.' : 'Everything is saved to the sheet.') + '</p>' +
        '<div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button></div>');
      return;
    }
    var html = '<h2>Not saved — needs attention</h2><p class="small muted">The server rejected these entries. Fix and resubmit them.</p>' +
      S.rejected.map(function (r, i) {
        return '<div class="card"><b>' + esc(r.label) + '</b><div class="banner err small">' + esc(r.error) + (r.errors.length ? '<br>• ' + r.errors.map(esc).join('<br>• ') : '') + '</div>' +
          '<button class="btn sm" data-dismiss="' + i + '">Dismiss</button></div>';
      }).join('') + '<div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button></div>';
    var m = modal(html);
    $$('[data-dismiss]', m).forEach(function (b) { b.onclick = function () { S.rejected.splice(Number(b.getAttribute('data-dismiss')), 1); saveOutbox(); closeModal(); showRejected(); }; });
  }
  window.addEventListener('online', flush);
  setInterval(flush, 15000);

  // ================================================================
  // 3. Modal
  // ================================================================
  function modal(html) {
    var root = $('#modalRoot');
    root.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    var bg = $('.modal-bg', root);
    bg.addEventListener('click', function (e) { if (e.target === bg) closeModal(); });
    $$('[data-close]', root).forEach(function (b) { b.onclick = closeModal; });
    return $('.modal', root);
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }
  function confirmBox(title, bodyHtml, okLabel) {
    return new Promise(function (resolve) {
      var m = modal('<h2>' + esc(title) + '</h2>' + bodyHtml + '<div class="row" style="margin-top:12px"><button class="btn" data-no>Cancel</button><span class="spacer"></span><button class="btn primary" data-yes>' + esc(okLabel || 'Confirm') + '</button></div>');
      $('[data-no]', m).onclick = function () { closeModal(); resolve(false); };
      $('[data-yes]', m).onclick = function () { closeModal(); resolve(true); };
    });
  }
  function promptBox(title, label) {
    return new Promise(function (resolve) {
      var m = modal('<h2>' + esc(title) + '</h2><label class="f" for="pb">' + esc(label) + '</label><textarea id="pb"></textarea>' +
        '<div class="row" style="margin-top:12px"><button class="btn" data-no>Cancel</button><span class="spacer"></span><button class="btn primary" data-yes>OK</button></div>');
      $('[data-no]', m).onclick = function () { closeModal(); resolve(null); };
      $('[data-yes]', m).onclick = function () { var v = $('#pb', m).value.trim(); if (!v) { $('#pb', m).focus(); return; } closeModal(); resolve(v); };
    });
  }

  // ================================================================
  // 4. Navigation
  // ================================================================
  var VIEWS = {};
  function go(name, params) { S.stack.push({ name: name, params: params || {} }); render(); }
  function back() { if (S.stack.length > 1) { S.stack.pop(); render(); } }
  function replace(name, params) { S.stack[S.stack.length - 1] = { name: name, params: params || {} }; render(); }
  function current() { return S.stack[S.stack.length - 1]; }
  function render() {
    S.charts.forEach(function (c) { try { c.destroy(); } catch (e) { /* ignore */ } }); S.charts = [];
    S.timers.forEach(clearInterval); S.timers = [];
    closeModal();
    var v = current();
    $('#backBtn').hidden = S.stack.length <= 1;
    window.scrollTo(0, 0);
    VIEWS[v.name](v.params);
  }
  function refreshCurrent() { var v = current(); if (v && v.params && v.params.__refreshable) render(); }
  function setTitle(t, sub) { $('#topTitle').textContent = t; $('#topSub').textContent = sub || ''; }
  function app(html) { var a = $('#app'); a.innerHTML = html; return a; }
  function loading(t) { app('<div class="center"><p class="muted">' + esc(t || 'Loading…') + '</p></div>'); }
  function errorView(e) { app('<div class="banner err" style="white-space:pre-wrap">' + esc(e && e.message || e) + '</div><button class="btn" id="retry">Retry</button>'); $('#retry').onclick = render; }

  // ================================================================
  // 5. Reference indexes
  // ================================================================
  function buildIndex() {
    var r = S.ref, I = S.idx = {};
    I.parts = {}; r.participants.forEach(function (p) { I.parts[p.participant_no] = p; });
    I.station = {}; r.stations.forEach(function (s) { I.station[s.day + '|' + s.station] = s; });
    I.checklist = {}; r.checklists.forEach(function (c) { I.checklist[c.checklist_id] = c; });
    I.items = {}; r.checklistItems.forEach(function (i) { (I.items[i.checklist_id] = I.items[i.checklist_id] || []).push(i); });
    I.osce = {}; r.osceScenarios.forEach(function (o) { I.osce[o.osce_id] = o; });
    I.osceItems = {}; r.osceItems.forEach(function (i) { (I.osceItems[i.osce_id] = I.osceItems[i.osce_id] || []).push(i); });
    I.scale = { checklist: {}, team_rubric: {} }; r.scales.forEach(function (s) { (I.scale[s.scale] = I.scale[s.scale] || {})[s.score] = s; });
  }
  function partName(no) { var p = S.idx.parts[no]; return p && p.name ? p.name : ''; }
  function groupMembers(g) { return S.ref.participants.filter(function (p) { return p.group === g; }).sort(function (a, b) { return (a.team + pad(a.participant_no)) < (b.team + pad(b.participant_no)) ? -1 : 1; }); }
  function pad(n) { return ('000' + n).slice(-3); }
  function roundsFor(day, st) {
    return ['R1', 'R2', 'R3', 'R4'].map(function (r) {
      var row = S.ref.rotation.filter(function (x) { return x.day === String(day) && x.round === r && x.station === st; })[0] || {};
      return { round: r, time: row.time || '', group: row.group || '' };
    });
  }
  function currentRound(day, st) {
    var ymd = S.ref.dayDates[day], t = now(), cur = 'R1';
    roundsFor(day, st).forEach(function (r) { if (t >= muscatMs(ymd, startOf(r.time))) cur = r.round; });
    return cur;
  }
  function unitsFor(day) {
    return S.ref.osceUnits.filter(function (u) { return u.day === String(day); }).map(function (u) { return { unit: u.unit, teams: u.teams.split('+'), osce_id: u.osce_id, label: u.label }; });
  }
  function scaleLabel(type, v) { var s = (S.idx.scale[type] || {})[v]; return s ? s.label : ''; }
  function access(day) { return S.access[String(day)]; }

  // ================================================================
  // 6. Boot / sign-in
  // ================================================================
  function boot() {
    S.token = (SERVER && SERVER.token) || LS.get('encor_token', '');
    if (SERVER && SERVER.token) LS.set('encor_token', SERVER.token);
    loadOutbox();
    loading('Signing in…');
    rpc('bootstrap', {}).then(function (res) {
      if (!res.ok) {
        if (res.code === 'NOT_AUTHORISED') { app('<div class="center"><h1>Not authorised</h1></div>'); return; }
        if (res.code === 'NOT_SIGNED_IN') { return signIn(); }
        return errorView(res.error);
      }
      var d = res.data;
      S.me = d.me; S.access = d.access; S.ref = d.ref; S.cfg = d.config; S.clockOffset = d.now - Date.now();
      buildIndex();
      $('#top').hidden = false;
      $('#backBtn').onclick = back;
      $('#syncBadge').onclick = showRejected;
      renderSync();
      S.stack = [{ name: 'home', params: {} }];
      render(); flush();
    }, function (e) { errorView('Cannot reach the server. ' + (e && e.message || '')); });
  }
  function signIn() {
    LS.del('encor_token');
    var url = SERVER && SERVER.signinUrl;
    app('<div class="center"><h1>ENCOR 2026 Assessment</h1><p class="muted">Sign in with your Google account to continue.</p>' +
      (url ? '<a class="btn primary" href="' + esc(url) + '" target="_top">Sign in with Google</a>'
           : '<p class="banner warn">Sign-in is not configured. Ask the workshop Admin to set it up (README → Sign-in).</p>') + '</div>');
  }

  // ================================================================
  // 7. Views — home / day
  // ================================================================
  VIEWS.home = function () {
    setTitle('ENCOR 2026', S.me.name + (S.me.isAdmin ? ' · Admin' : ''));
    var ev = S.ref.timetable.length ? '' : '';
    var days = ['1', '2', '3'].map(function (d) {
      var a = access(d), assigned = S.me.isAdmin || a.day.view;
      var topics = S.ref.timetable.filter(function (t) { return t.day === d && !/^(Registration|Breakfast|Opening|Closing)/i.test(t.topic); }).map(function (t) { return t.topic; });
      return '<button class="tile" data-day="' + d + '" ' + (assigned ? '' : 'disabled aria-disabled="true" style="opacity:.55"') + '>' +
        '<div class="k">Day ' + d + ' · ' + esc(fmtDate(S.ref.dayDates[d])) + '</div>' +
        '<div class="d">' + esc(topics.slice(0, 3).join(' · ')) + '</div>' +
        (assigned ? '' : '<div class="d muted">Not assigned</div>') + '</button>';
    }).join('');
    var roles = S.me.isAdmin ? 'Admin' : S.me.roles.map(function (r) { return r.role.replace('_', ' ') + ' (day ' + r.days.join(',') + ', ' + r.stations.join(',') + ')'; }).join('; ');
    app('<p class="small muted">Signed in as ' + esc(S.me.email) + ' · ' + esc(roles) + '</p>' +
      '<h2>Select day</h2><div class="grid three">' + days + '</div>' +
      '<h2 style="margin-top:20px">Reports</h2><div class="grid two">' +
      '<button class="tile" id="toDash"><div class="k">Dashboard</div><div class="d">Completion, scores, item analysis, OSCE, progress</div></button>' +
      (S.me.isAdmin ? '<button class="tile" id="toAdmin"><div class="k">Admin</div><div class="d">Users, roster, settings, readiness lists, export</div></button>' : '') + '</div>');
    $$('[data-day]').forEach(function (b) { if (!b.disabled) b.onclick = function () { go('day', { day: b.getAttribute('data-day') }); }; });
    $('#toDash').onclick = function () { go('dashboard', {}); };
    if ($('#toAdmin')) $('#toAdmin').onclick = function () { go('admin', { tab: 'users' }); };
    void ev;
  };

  VIEWS.day = function (p) {
    var d = p.day, a = access(d);
    setTitle('Day ' + d, fmtDate(S.ref.dayDates[d]));
    var tt = S.ref.timetable.filter(function (t) { return t.day === d; }).map(function (t) {
      return '<li><span class="mono"><b>' + esc(t.time) + '</b></span><span><b>' + esc(t.topic) + '</b>' +
        (t.speaker ? '<br><span class="small muted">' + esc(t.speaker) + '</span>' : '') +
        (t.objectives ? '<br><span class="small">' + esc(t.objectives) + '</span>' : '') + '</span></li>';
    }).join('');
    var html = '<details class="info"' + (d === '1' ? ' open' : '') + '><summary>Timetable</summary><ul class="timeline" style="grid-template-columns:1fr">' +
      tt.replace(/<li>/g, '<li style="grid-template-columns:6.5rem 1fr">') + '</ul></details>';
    var tiles = [];
    if (d !== '1') {
      ['A', 'B', 'C', 'D'].forEach(function (s) {
        if (!a.stations[s].view) return;
        var st = S.idx.station[d + '|' + s] || {}, cl = S.idx.checklist[st.checklist_id] || {};
        var cr = currentRound(d, s), g = (roundsFor(d, s).filter(function (r) { return r.round === cr; })[0] || {}).group;
        tiles.push('<button class="tile" data-st="' + s + '"><div class="k">Station ' + s + ' · ' + esc(st.checklist_id) + '</div><div class="d">' + esc(st.topic) + '</div>' +
          '<div class="d small muted">' + esc(cl.item_count) + ' items · now ' + esc(cr) + ' (' + esc(g) + ')</div></button>');
      });
      var anyOsce = ['G1', 'G2', 'G3', 'G4'].some(function (g) { return a.osce[g].view; });
      if (anyOsce) {
        var sc = unitsFor(d).map(function (u) { return u.osce_id; }).filter(function (x, i, arr) { return arr.indexOf(x) === i; });
        tiles.push('<button class="tile" id="toOsce"><div class="k">OSCE · ' + esc(sc.join(' / ')) + '</div><div class="d">' +
          esc(sc.map(function (id) { return (S.idx.osce[id] || {}).title; }).join(' · ')) + '</div></button>');
      }
    }
    html += d === '1' ? '<div class="banner warn small">Day 1 has no checklists or OSCE. Timetable and attendance only.</div>' : '';
    if (tiles.length) html += '<h2>Assessment</h2><div class="grid two">' + tiles.join('') + '</div>';
    var org = [];
    if (a.day.attendance || S.me.isAdmin) org.push('<button class="tile" data-att="DAY"><div class="k">Attendance — Day ' + d + '</div><div class="d">Mark who is present today</div></button>');
    if (d !== '1') ['A', 'B', 'C', 'D'].forEach(function (s) {
      if (a.stations[s].readiness) org.push('<button class="tile" data-ready="' + s + '"><div class="k">Readiness — Station ' + s + '</div><div class="d">Equipment ticklist</div></button>');
    });
    if (d !== '1') ['A', 'B', 'C', 'D'].forEach(function (s) {
      if (a.stations[s].finalise) org.push('<button class="tile" data-review="' + s + '"><div class="k">Review — Station ' + s + '</div><div class="d">Check and finalise submissions</div></button>');
    });
    if (d !== '1' && (S.me.isAdmin || ['G1', 'G2', 'G3', 'G4'].some(function (g) { return a.osce[g].finalise; })))
      org.push('<button class="tile" data-review="OSCE"><div class="k">Review — OSCE</div><div class="d">Individual scores and team rubrics</div></button>');
    if (org.length) html += '<h2 style="margin-top:20px">Station management</h2><div class="grid two">' + org.join('') + '</div>';
    app(html);
    $$('[data-st]').forEach(function (b) { b.onclick = function () { go('station', { day: d, station: b.getAttribute('data-st') }); }; });
    if ($('#toOsce')) $('#toOsce').onclick = function () { go('osce', { day: d }); };
    $$('[data-att]').forEach(function (b) { b.onclick = function () { go('attendance', { day: d, session: 'DAY' }); }; });
    $$('[data-ready]').forEach(function (b) { b.onclick = function () { go('readiness', { day: d, station: b.getAttribute('data-ready') }); }; });
    $$('[data-review]').forEach(function (b) { b.onclick = function () { go('review', { day: d, station: b.getAttribute('data-review') }); }; });
  };

  // ================================================================
  // 8. Station → round → participants
  // ================================================================
  VIEWS.station = function (p) {
    p.__refreshable = true;
    var d = p.day, s = p.station, st = S.idx.station[d + '|' + s], cl = S.idx.checklist[st.checklist_id];
    p.round = p.round || currentRound(d, s);
    setTitle('Day ' + d + ' · Station ' + s, st.checklist_id + ' · ' + cl.title);
    loading();
    getOr('stationStatus', { day: d, station: s }, { checklist_id: st.checklist_id, status: {} }).then(function (data) {
      var rounds = roundsFor(d, s), rd = rounds.filter(function (r) { return r.round === p.round; })[0];
      var a = access(d).stations[s];
      var html = (data.__offline ? OFFLINE_BANNER : '') + '<details class="info"><summary>Station ' + esc(s) + ': ' + esc(st.topic) + '</summary>' +
        '<p class="small">Checklist <b>' + esc(st.checklist_id) + '</b>: ' + esc(cl.title) + ' (' + esc(cl.item_count) + ' items, max ' + esc(cl.max_score) + ')</p>' +
        '<p class="small">Facilitator: ' + esc(st.facilitator) + '<br>Subject expert: ' + esc(st.subject_expert) + '<br>Organizer: ' + esc(st.organizer) + '</p></details>';
      html += '<div class="chips" role="group" aria-label="Round">' + rounds.map(function (r) {
        return '<button class="chip" data-round="' + r.round + '" aria-pressed="' + (r.round === p.round) + '">' + r.round + ' · ' + esc(r.group) + '<small>' + esc(r.time) + '</small></button>';
      }).join('') + '</div>';
      html += '<div class="row between" style="margin:10px 0"><h2 style="margin:0">' + esc(rd.group) + ' at Station ' + esc(s) + '</h2>' +
        '<label class="toggle small"><input type="checkbox" id="showAll"' + (p.showAll ? ' checked' : '') + '> Show all participants</label></div>';
      if (p.showAll) html += '<input type="search" id="find" inputmode="numeric" placeholder="Find participant number" value="' + esc(p.find || '') + '" style="margin-bottom:8px">';
      var list = p.showAll ? S.ref.participants.slice().sort(function (x, y) { return Number(x.participant_no) - Number(y.participant_no); }) : groupMembers(rd.group);
      if (p.showAll && p.find) list = list.filter(function (x) { return x.participant_no.indexOf(p.find) === 0; });
      html += '<div class="card" style="padding:4px 10px"><ul class="list">' + list.map(function (x) {
        var stt = statusFor(d, s, st.checklist_id, x.participant_no, data.status[x.participant_no]);
        var off = x.group !== rd.group;
        return '<li><button class="item" data-p="' + esc(x.participant_no) + '" data-off="' + (off ? 1 : 0) + '"><span class="no">#' + esc(x.participant_no) + '</span>' +

          '<span class="st ' + stt.cls + '">' + esc(stt.label) + '</span></button></li>';
      }).join('') + '</ul></div>';
      var extras = [];
      if (a.attendance) extras.push('<button class="btn" id="att">Attendance ' + esc(p.round) + '</button>');
      if (a.readiness) extras.push('<button class="btn" id="ready">Readiness</button>');

      $('#showAll').onchange = function () { p.showAll = this.checked; render(); };
      if ($('#find')) { $('#find').oninput = function () { p.find = this.value.trim(); var pos = this.selectionStart; render(); var f = $('#find'); f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }; }
      $$('[data-p]').forEach(function (b) {
        b.onclick = function () {
          var pno = b.getAttribute('data-p'), off = b.getAttribute('data-off') === '1';
          var open = function (re) { go('checklist', { day: d, station: s, round: p.round, participant_no: pno, is_reattempt: re }); };
          if (!off) return open(false);
          confirmBox('Score as re-attempt?', '<p>Participant #' + esc(pno) + ' is not in ' + esc(rd.group) + ', the group rotated to Station ' + esc(s) + ' in ' + esc(p.round) + '. The entry will be flagged as a re-attempt / late candidate.</p>', 'Continue').then(function (y) { if (y) open(true); });
        };
      });
      if ($('#att')) $('#att').onclick = function () { go('attendance', { day: d, session: s + '-' + p.round }); };
      if ($('#ready')) $('#ready').onclick = function () { go('readiness', { day: d, station: s }); };
      if ($('#rev')) $('#rev').onclick = function () { go('review', { day: d, station: s }); };

  };
  function statusFor(d, s, cid, pno, srv) {
    if (pendingFor(function (pl, act) { return act === 'submitChecklist' && pl.day === d && pl.checklist_id === cid && pl.participant_no === pno; })) return { cls: 'pending', label: 'Waiting to sync' };
    if (srv && srv.finalised) return { cls: 'finalised', label: 'Finalised' };
    if (srv && srv.mine) return srv.mine.status === 'unlocked' ? { cls: 'unlocked', label: 'Unlocked' } : { cls: 'mine', label: 'Submitted by me' };
    if (LS.get(draftKey('cl', d, s, pno), null)) return { cls: 'draft', label: 'In progress' };
    if (srv && srv.others) return { cls: 'submitted', label: 'Submitted (other)' };
    return { cls: 'not_started', label: 'Not started' };
  }
  function draftKey() { return 'encor_draft|' + Array.prototype.slice.call(arguments).join('|'); }

  // ================================================================
  // 9. Generic scoring form (checklist, OSCE member, rubric)
  // ================================================================
  /**
   * cfg: {title, sub, items:[{key,label,text}], scaleType, values:{}, comment, locked, lockedMsg, reasonRequired,
   *       draftKey, summary(fn), onSubmit(values, comment, reason), notes}
   */
  function scoringForm(cfg) {
    var vals = Object.assign({}, cfg.values || {}), draft = cfg.draftKey ? LS.get(cfg.draftKey, null) : null;
    var comment = cfg.comment || '';
    if (draft && !cfg.locked) { vals = Object.assign(vals, draft.v || {}); comment = draft.c !== undefined ? draft.c : comment; }
    var max = cfg.items.length * 2;
    var html = (cfg.notes || '') + (cfg.locked ? '<div class="banner ok">' + esc(cfg.lockedMsg || 'Finalised — read only.') + '</div>' : '') +
      (draft && !cfg.locked ? '<div class="banner warn small">Restored your unsent draft from this device.</div>' : '');
    html += cfg.items.map(function (it) {
      return '<div class="item" data-k="' + esc(it.key) + '"><div class="q"><b>' + esc(it.label) + '</b><span>' + esc(it.text) + '</span></div>' +
        '<div class="scores" role="radiogroup" aria-label="Score for ' + esc(it.label) + '">' + [2, 1, 0].map(function (v) {
          return '<button class="score" data-v="' + v + '" aria-pressed="false"' + (cfg.locked ? ' disabled' : '') + '><b>' + v + '</b><small>' + esc(scaleLabel(cfg.scaleType, v)) + '</small></button>';
        }).join('') + '</div></div>';
    }).join('');
    html += '<label class="f" for="cmt">Comment (optional)</label><textarea id="cmt"' + (cfg.locked ? ' disabled' : '') + '>' + esc(comment) + '</textarea>';
    if (cfg.reasonRequired) html += '<label class="f" for="rsn">Reason for correction (required)</label><textarea id="rsn"></textarea>';
    html += '<div class="totalbar"><div class="inner"><div class="t"><b id="tot">0 / ' + max + '</b> <span id="pc" class="muted"></span><br><span id="sc" class="small muted"></span></div>' +
      (cfg.locked ? '' : '<button class="btn primary" id="submit" disabled>Submit</button>') + '</div></div>';
    app(html);
    function paint() {
      var total = 0, n = 0;
      $$('.item').forEach(function (el) {
        var k = el.getAttribute('data-k'), v = vals[k];
        el.classList.toggle('unscored', v === undefined && !cfg.locked);
        $$('.score', el).forEach(function (b) { b.setAttribute('aria-pressed', String(String(v) === b.getAttribute('data-v'))); });
        if (v !== undefined) { total += Number(v); n++; }
      });
      $('#tot').textContent = total + ' / ' + max;
      $('#pc').textContent = '(' + fmtPct(100 * total / max) + ')';
      $('#sc').textContent = n + ' of ' + cfg.items.length + ' scored';
      if ($('#submit')) $('#submit').disabled = n !== cfg.items.length;
      if (cfg.draftKey && !cfg.locked && n) LS.set(cfg.draftKey, { v: vals, c: $('#cmt').value });
      return { total: total, n: n };
    }
    $$('.item').forEach(function (el) {
      var k = el.getAttribute('data-k');
      $$('.score', el).forEach(function (b) { b.onclick = function () { vals[k] = Number(b.getAttribute('data-v')); paint(); }; });
    });
    $('#cmt').oninput = function () { if (cfg.draftKey && Object.keys(vals).length) LS.set(cfg.draftKey, { v: vals, c: this.value }); };
    paint();
    if ($('#submit')) $('#submit').onclick = function () {
      var t = paint(); if (t.n !== cfg.items.length) return;
      var reason = cfg.reasonRequired ? $('#rsn').value.trim() : '';
      if (cfg.reasonRequired && !reason) { toast('Enter a reason for the correction.'); $('#rsn').focus(); return; }
      var counts = { 2: 0, 1: 0, 0: 0 }; Object.keys(vals).forEach(function (k) { counts[vals[k]]++; });
      var body = (cfg.summary ? cfg.summary() : '') +
        '<table><tr><th>Total</th><td class="num"><b>' + t.total + ' / ' + max + '</b> (' + fmtPct(100 * t.total / max) + ')</td></tr>' +
        [2, 1, 0].map(function (v) { return '<tr><th>' + v + ' · ' + esc(scaleLabel(cfg.scaleType, v)) + '</th><td class="num">' + counts[v] + '</td></tr>'; }).join('') + '</table>' +
        ($('#cmt').value.trim() ? '<p class="small"><b>Comment:</b> ' + esc($('#cmt').value.trim()) + '</p>' : '');
      confirmBox('Confirm submission', body, 'Submit').then(function (y) {
        if (!y) return;
        cfg.onSubmit(vals, $('#cmt').value.trim(), reason);
        if (cfg.draftKey) LS.del(cfg.draftKey);
        toast('Queued — saving to sheet…');
        back();
      });
    };
  }

  VIEWS.checklist = function (p) {
    var d = p.day, s = p.station, st = S.idx.station[d + '|' + s], cid = st.checklist_id, cl = S.idx.checklist[cid];
    setTitle('#' + p.participant_no + ' · ' + cid, (partName(p.participant_no) || 'Participant ' + p.participant_no) + ' · ' + p.round + (p.is_reattempt ? ' · re-attempt' : ''));
    loading();
    var req = p.record_id ? get('getRecord', { kind: 'checklist', id: p.record_id }) : getOr('getRecord', { kind: 'checklist', day: d, checklist_id: cid, participant_no: p.participant_no }, { record: null });
    req.then(function (res) {
      var rec = res.record, isAdminCorrection = !!p.record_id && S.me.isAdmin;
      if (!access(d).stations[s].score && !isAdminCorrection) { app('<div class="banner warn">Your role does not score at this station.</div>'); return; }
      var values = {}; if (rec) Object.keys(rec.scores).forEach(function (k) { values[k] = Number(rec.scores[k]); });

        scaleType: 'checklist', values: values, comment: rec ? rec.comment : '', locked: locked, reasonRequired: needReason,
        lockedMsg: 'Finalised by the Station Leader. Only an Admin can correct it.',
        draftKey: locked || isAdminCorrection ? null : draftKey('cl', d, s, p.participant_no),
        notes: (res.__offline ? OFFLINE_BANNER : '') + '<p class="small muted">' + esc(cl.title) + '</p>' + (rec ? '<div class="banner warn small">' + (rec.locked ? 'Finalised record' : 'Editing your submitted entry') + ' (version ' + esc(rec.version) + '). Saving creates a new version; the previous one is kept.</div>' : ''),
        summary: function () { return '<p>Participant <b>#' + esc(p.participant_no) + '</b> ' + esc(partName(p.participant_no)) + '<br>Checklist <b>' + esc(cid) + '</b> · Station ' + esc(s) + ' · ' + esc(p.round) + (p.is_reattempt ? ' · re-attempt' : '') + '</p>'; },
        onSubmit: function (v, c, reason) {
          enqueue('submitChecklist', { day: d, station: s, round: p.round, checklist_id: cid, participant_no: p.participant_no, scores: v, comment: c,
            is_reattempt: !!p.is_reattempt, assessment_id: rec ? rec.assessment_id : undefined, reason: reason }, '#' + p.participant_no + ' ' + cid);
        }
      });
    }, errorView);

  function scenarioInfo(o) {

  function roleKey(d, g, unit) { return 'encor_roles|' + d + '|' + g + '|' + unit; }

  VIEWS.osceTeam = function (p) {
    p.__refreshable = true;
    var d = p.day, g = p.group;
    loading();
    get('osceTeam', { day: d, group: g, team: p.unit }).then(function (data) {
      var u = data.unit, o = S.idx.osce[u.osce_id], roleTitles = (o.details || {}).roles || {};
      setTitle(g + ' · ' + u.label, u.osce_id + ' · ' + o.title);
      // role assignment: participant_no -> role_no (local first, then server)
      var assign = LS.get(roleKey(d, g, u.unit), null);
      if (!assign) {
        assign = {};
        Object.keys(data.role_assignment || {}).forEach(function (rn) { String(data.role_assignment[rn]).split(',').forEach(function (pno) { if (pno && pno !== 'unassigned') assign[pno] = rn; }); });
        Object.keys(data.mine).forEach(function (pno) { if (data.mine[pno].role_no) assign[pno] = data.mine[pno].role_no; });
      }
      var canScore = access(d).osce[g].score;
      var html = scenarioInfo(o);
      html += '<div class="card"><h2>1 · Assign roles</h2><p class="small muted">Each scored member needs a role. Roles nobody holds are stored as "unassigned".</p>' +
        data.members.map(function (pno) {
          return '<div class="row" style="margin-bottom:8px"><span style="min-width:5.5rem"><b>#' + esc(pno) + '</b> <span class="small muted">' + esc((S.idx.parts[pno] || {}).team ? 'Team ' + S.idx.parts[pno].team : '') + '</span></span>' +
            '<select data-role="' + esc(pno) + '" style="flex:1"' + (canScore ? '' : ' disabled') + '><option value="">— no role —</option>' + ['R1', 'R2', 'R3', 'R4'].map(function (rn) {
              return '<option value="' + rn + '"' + (assign[pno] === rn ? ' selected' : '') + '>' + rn + ' · ' + esc(roleTitles[rn] || '') + '</option>';
            }).join('') + '</select></div>';
        }).join('') + '<p class="small" id="unass"></p></div>';
      html += '<div class="card"><h2>2 · Score each member</h2><p class="small muted">5 role items + common items X1–X3 · max 16.</p><ul class="list">' +
        data.members.map(function (pno) {
          var m = data.mine[pno], pend = pendingFor(function (pl, act) { return act === 'submitOsce' && pl.osce_id === u.osce_id && pl.participant_no === pno; });
          var lab = pend ? ['pending', 'Waiting to sync'] : m ? (m.locked ? ['finalised', 'Finalised · ' + m.total + '/' + m.max] : ['mine', 'Submitted · ' + m.total + '/' + m.max]) :
            (LS.get(draftKey('osce', d, u.osce_id, pno), null) ? ['draft', 'In progress'] : ['not_started', 'Not started']);
          return '<li><button class="item" data-m="' + esc(pno) + '"><span class="no">#' + esc(pno) + '</span><span class="nm">' + (partName(pno) ? esc(partName(pno)) : '<span class="muted">Name not imported</span>') +
            '<br><span class="small muted" data-rl="' + esc(pno) + '"></span></span><span class="st ' + lab[0] + '">' + esc(lab[1]) + '</span></button></li>';
        }).join('') + '</ul></div>';
      var rub = data.rubric;
      html += '<div class="card"><h2>3 · Team rubric (lead assessor)</h2><p class="small muted">6 criteria, 0 / 1 / 2, max 12. Feedback only, not individual pass/fail.</p>' +
        '<button class="btn block" id="rubric"' + (canScore ? '' : ' disabled') + '>' + (rub ? 'Team rubric: ' + esc(rub.total) + ' / ' + esc(rub.max) + (rub.locked ? ' · Finalised' : ' · Edit') : 'Score team rubric') + '</button></div>';
      if (!canScore) html += '<p class="small muted">View only — your role does not score this room.</p>';
      app(html);
      function paintRoles() {
        var held = {}; Object.keys(assign).forEach(function (pno) { if (data.members.indexOf(pno) >= 0 && assign[pno]) (held[assign[pno]] = held[assign[pno]] || []).push(pno); });
        var un = ['R1', 'R2', 'R3', 'R4'].filter(function (rn) { return !held[rn]; });
        var dup = Object.keys(held).filter(function (rn) { return held[rn].length > 1; });
        $('#unass').innerHTML = (un.length ? 'Unassigned: ' + un.map(function (rn) { return rn + ' ' + esc(roleTitles[rn] || ''); }).join(', ') : 'All four roles assigned.') +
          (dup.length ? '<br><span style="color:var(--warn)">Shared role: ' + dup.join(', ') + ' (more than one member).</span>' : '');
        $$('[data-rl]').forEach(function (el) { var rn = assign[el.getAttribute('data-rl')]; el.textContent = rn ? rn + ' · ' + (roleTitles[rn] || '') : 'No role assigned'; });
      }
      $$('[data-role]').forEach(function (sel) { sel.onchange = function () { assign[sel.getAttribute('data-role')] = sel.value; LS.set(roleKey(d, g, u.unit), assign); paintRoles(); }; });
      paintRoles();
      $$('[data-m]').forEach(function (b) {
        b.onclick = function () {
          var pno = b.getAttribute('data-m');
          if (!canScore) return;
          if (!assign[pno]) { toast('Assign a role to #' + pno + ' first.'); return; }
          go('osceMember', { day: d, group: g, unit: u.unit, osce_id: u.osce_id, participant_no: pno, role_no: assign[pno], record_id: data.mine[pno] && data.mine[pno].id });
        };
      });
      $('#rubric').onclick = function () {
        var ra = {}; ['R1', 'R2', 'R3', 'R4'].forEach(function (rn) {
          var who = data.members.filter(function (pno) { return assign[pno] === rn; });
          ra[rn] = who.length ? who.join(',') : 'unassigned';
        });
        go('rubric', { day: d, group: g, unit: u.unit, osce_id: u.osce_id, role_assignment: ra, record_id: rub && rub.rubric_id });
      };
    }, errorView);
  };

            '<div class="kpi"><div class="v">' + fmtPct(s.competent_item_rate) + '</div><div class="l">Competent-item rate</div></div>' +
            '<div class="kpi"><div class="v">' + (d.threshold_set ? fmtPct(s.competency_rate) : '—') + '</div><div class="l">' + (d.threshold_set ? 'Competency rate' : 'Threshold not set') + '</div></div></div>';
          return '<div class="card"><h2>' + esc(stLabel(s)) + '</h2><p class="small muted">' + esc(s.topic) + '</p>' + kp +
            '<h3>Item analysis — weakest steps first</h3>' + legend210() + '<div class="chartbox" style="height:' + Math.max(220, 34 * items.length + 50) + 'px"><canvas id="ia' + i + '" aria-label="Item analysis ' + esc(s.checklist_id) + '"></canvas></div>' +
            tableDetails('Item table (full text)', table(['Item', 'Text', 'n', '% 2', '% 1', '% 0'], items.map(function (it) { return [it.item_no, it.text, it.n, fmtPct(it.p2), fmtPct(it.p1), fmtPct(it.p0)]; }), { num: [0, 2, 3, 4, 5], name: 'items_' + s.checklist_id })) + '</div>';
        }).join('');
      },
      after: function (d) {
        d.stations.forEach(function (s, i) {
          var items = (d.items[s.checklist_id] || []).slice().sort(function (a, b) { return (a.p2 === null ? 101 : a.p2) - (b.p2 === null ? 101 : b.p2); });
          var byItem = {}; items.forEach(function (it) { byItem['#' + it.item_no] = it.text; });
          stackChart($('#ia' + i), items.map(function (it) { return '#' + it.item_no; }), { 2: items.map(function (it) { return it.p2; }), 1: items.map(function (it) { return it.p1; }), 0: items.map(function (it) { return it.p0; }) },
            { horizontal: true, tick: function (v) { return v + '%'; } });
          var c = S.charts[S.charts.length - 1];
          if (c) { c.options.plugins.tooltip.callbacks.title = function (ctx) { var t = byItem[ctx[0].label] || ''; return ctx[0].label + ' ' + (t.length > 90 ? t.slice(0, 90) + '…' : t); }; c.update(); }
        });
      }
    },
    osce: {
      html: function (d) {
        var o = d.osce;
        if (!o.byScenario.length) return '<p class="muted">No OSCE in your scope for these filters.</p>';
        var html = '<div class="kpis">' + o.completion.map(function (c) { return '<div class="kpi"><div class="v">' + fmtPct(c.pct) + '</div><div class="l">Day ' + c.day + ' OSCE completion · ' + c.scored + '/' + c.expected + ' teams</div></div>'; }).join('') + '</div>';
        html += '<div class="grid two"><div class="card"><h3>Mean individual score by scenario (/16)</h3><div class="chartbox"><canvas id="oScen"></canvas></div>' +
          tableDetails('Table', table(['Scenario', 'n', 'Mean /16', '%'], o.byScenario.map(function (s) { return [s.osce_id, s.n, fmtNum(s.mean), fmtPct(s.mean_pct)]; }), { num: [1, 2, 3], name: 'osce_scenario' })) + '</div>' +
          '<div class="card"><h3>Team rubric mean (/12)</h3><div class="chartbox"><canvas id="oRub"></canvas></div>' +
          tableDetails('Table', table(['Scenario', 'Teams', 'Mean /12'], o.rubric.map(function (r) { return [r.osce_id, r.teams, fmtNum(r.mean_total)]; }), { num: [1, 2], name: 'osce_rubric' })) + '</div></div>';
        html += o.byScenario.map(function (s, i) {
          var roles = o.byRole.filter(function (r) { return r.osce_id === s.osce_id; }), rub = o.rubric.filter(function (r) { return r.osce_id === s.osce_id; })[0];
          return '<div class="card"><h2>' + esc(s.osce_id) + ' · ' + esc(s.title) + '</h2><div class="grid two">' +
            '<div><h3>Mean score by role (/16)</h3><div class="chartbox"><canvas id="oRole' + i + '"></canvas></div>' + table(['Role', 'n', 'Mean /16'], roles.map(function (r) { return [r.role_no + ' ' + r.role, r.n, fmtNum(r.mean)]; }), { num: [1, 2], name: 'osce_roles_' + s.osce_id }) + '</div>' +
            '<div><h3>Team rubric profile (mean /2)</h3><div class="chartbox"><canvas id="oCrit' + i + '"></canvas></div>' + table(['#', 'Criterion', 'n', 'Mean /2'], (rub ? rub.criteria : []).map(function (c) { return [c.no, c.text, c.n, fmtNum(c.mean, 2)]; }), { num: [0, 2, 3], name: 'osce_criteria_' + s.osce_id }) + '</div></div></div>';
        }).join('');
        html += '<div class="card"><h3>By group and team</h3>' + table(['Day', 'Group', 'Team', 'Scenario', 'Scored', 'Mean /16', 'Rubric /12'], o.byUnit.map(function (u) { return ['Day ' + u.day, u.group, u.label, u.osce_id, u.scored + '/' + u.members, fmtNum(u.mean), u.rubric_total === null ? '—' : u.rubric_total]; }), { num: [4, 5, 6], name: 'osce_units' }) + '</div>';
        return html;
      },
      after: function (d) {
        var o = d.osce; if (!o.byScenario.length) return;
        barChart($('#oScen'), o.byScenario.map(function (s) { return s.osce_id; }), o.byScenario.map(function (s) { return s.mean; }), { max: 16, fmt: function (v) { return fmtNum(v); } });
        barChart($('#oRub'), o.rubric.map(function (s) { return s.osce_id; }), o.rubric.map(function (s) { return s.mean_total; }), { max: 12, fmt: function (v) { return fmtNum(v); } });
        o.byScenario.forEach(function (s, i) {
          var roles = o.byRole.filter(function (r) { return r.osce_id === s.osce_id; }), rub = o.rubric.filter(function (r) { return r.osce_id === s.osce_id; })[0];
          barChart($('#oRole' + i), roles.map(function (r) { return r.role_no; }), roles.map(function (r) { return r.mean; }), { max: 16, fmt: function (v) { return fmtNum(v); } });
          if (rub) barChart($('#oCrit' + i), rub.criteria.map(function (c) { return '#' + c.no; }), rub.criteria.map(function (c) { return c.mean; }), { max: 2, horizontal: true, fmt: function (v) { return fmtNum(v, 2); } });
        });
      }
    },
    group: {
      html: function (d) {
        var st = d.stations;
        return '<div class="card"><h3>Mean score % by group</h3><div class="chartbox"><canvas id="gMean"></canvas></div>' +
          '<div class="tablewrap">' + table(['Group', 'n', 'Mean %'].concat(st.map(stLabel)), d.groups.map(function (g) { return [g.group, g.n, fmtPct(g.mean_pct)].concat(st.map(function (s) { return fmtPct(g.byStation[s.day + '|' + s.station]); })); }),
            { num: [1, 2].concat(st.map(function (_, i) { return i + 3; })), name: 'groups' }) + '</div></div>' +
          '<div class="card"><h3>Mean score % by team</h3>' + table(['Group', 'Team', 'Checklists', 'Mean %'], d.teams.map(function (t) { return [t.group, t.team, t.n, fmtPct(t.mean_pct)]; }), { num: [2, 3], name: 'teams' }) + '</div>';
      },
      after: function (d) { barChart($('#gMean'), d.groups.map(function (g) { return g.group; }), d.groups.map(function (g) { return g.mean_pct; }), { max: 100, fmt: function (v) { return Math.round(v) + '%'; }, tick: function (v) { return v + '%'; } }); }
    },
    participant: {
      html: function (d) {
        var D = S.dash;
        var html = '<div class="row noprint" style="margin-bottom:10px"><input type="search" id="pno" inputmode="numeric" placeholder="Participant number (1–48)" value="' + esc(D.participant || '') + '" style="max-width:240px"><button class="btn sm" id="pgo">Show</button></div>';
        var p = d.participant;
        if (!p) return html + '<p class="muted">Enter a participant number.</p>';
        html += '<div class="card"><h2>#' + esc(p.participant.participant_no) + ' ' + esc(p.participant.name || '') + '</h2><p class="small muted">' + esc(p.participant.group) + ' · Team ' + esc(p.participant.team) + (p.participant.staff_id ? ' · Staff ID ' + esc(p.participant.staff_id) : '') + '</p>' +
          table(['Checklist', 'Status', 'Score', '%'], p.checklists.map(function (c) { return ['D' + c.day + ' ' + c.station + ' · ' + c.checklist_id, c.status.replace('_', ' '), c.total === null ? '—' : c.total + '/' + c.max, fmtPct(c.pct)]; }), { num: [2, 3], name: 'participant' }) +
          (p.osce.length ? '<h3 style="margin-top:12px">OSCE</h3>' + table(['Scenario', 'Role', 'Score', 'Status'], p.osce.map(function (o) { return [o.osce_id, o.role_no, o.total + '/' + o.max, o.status]; }), { num: [2], name: 'participant_osce' }) : '') + '</div>';
        html += p.checklists.filter(function (c) { return c.items.length; }).map(function (c) {
          return '<details class="info"><summary>' + esc(c.checklist_id) + ' item scores</summary>' + table(['#', 'Item', 'Score'], c.items.map(function (i) { return [i.item_no, i.text, i.scores.join(' / ')]; }), { num: [0, 2], name: 'items_' + c.checklist_id }) + '</details>';
        }).join('');
        return html;
      },
      after: function () {
        var go2 = function () { S.dash.participant = $('#pno').value.trim(); loadDash(); };
        $('#pgo').onclick = go2; $('#pno').onkeydown = function (e) { if (e.key === 'Enter') go2(); };
      }
    },
    progress: {
      html: function (d) {
        var cols = d.progress.columns;
        var sym = { finalised: '✔', submitted: '●', not_started: '–' };
        return '<div class="legend"><span><span class="cell finalised">✔</span> Finalised</span><span><span class="cell submitted">●</span> Submitted</span><span><span class="cell not_started">–</span> Not started</span></div>' +
          '<div class="card tablewrap"><table class="progress" data-csv="progress"><thead><tr><th>#</th>' + cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          d.progress.rows.map(function (r) {
            return '<tr><td class="p"><b>' + esc(r.participant_no) + '</b> <span class="small muted">' + esc(r.group) + r.team + '</span></td>' + cols.map(function (c) {
              var x = r.cells[c.key], st = x.status === 'finalised' ? 'finalised' : x.status === 'not_started' ? 'not_started' : 'submitted';
              var tip = x.pct !== undefined && x.pct !== null ? x.pct + '%' : x.total !== undefined ? x.total + '/' + x.max : '';
              return '<td><span class="cell ' + st + '" title="' + esc(st.replace('_', ' ') + (tip ? ' · ' + tip : '')) + '">' + sym[st] + '<span class="sr"> ' + st + '</span></span></td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
    }
  };
  function exportCsv() {
    var tables = $$('#dash table[data-csv]');
    if (!tables.length) { toast('Nothing to export on this tab.'); return; }
    var out = tables.map(function (t) {
      var rows = $$('tr', t).map(function (tr) { return $$('th,td', tr).map(function (c) { var s = c.textContent.replace(/\s+/g, ' ').trim(); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','); });
      return '# ' + t.getAttribute('data-csv') + '\r\n' + rows.join('\r\n');
    }).join('\r\n\r\n');
    download('encor2026_' + S.dash.tab + '.csv', out);
  }
  function download(name, text) {
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { /* fall through to copy box */ }
    var m = modal('<h2>' + esc(name) + '</h2><p class="small muted">If the download did not start, copy the CSV below.</p><textarea style="min-height:200px" readonly>' + esc(text) + '</textarea><div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button></div>');
    void m;
  }

  // ================================================================
  // 14. Admin
  // ================================================================
  VIEWS.admin = function (p) {
    setTitle('Admin', 'Users · roster · settings');
    var tabs = [['users', 'Users'], ['roster', 'Roster'], ['settings', 'Settings'], ['readiness', 'Readiness'], ['seed', 'Seed check'], ['export', 'Export']];
    app('<div class="tabs">' + tabs.map(function (t) { return '<button class="tab" data-at="' + t[0] + '" aria-selected="' + (p.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div><div id="adm"><p class="muted">Loading…</p></div>');
    $$('[data-at]').forEach(function (b) { b.onclick = function () { p.tab = b.getAttribute('data-at'); render(); }; });
    get('adminGet', {}).then(function (data) { ADMIN[p.tab](data, p); }, errorView);
  };
  var ADMIN = {
    users: function (data) {
      var html = '<div class="card"><h2>Users (allow-list)</h2><p class="small muted">The script owner (' + esc(data.owner) + ') is always Admin. ' +
        'Day: <code>2</code>, <code>2,3</code> or <code>*</code>. Station: <code>A</code>–<code>D</code>, <code>OSCE</code> (all rooms), <code>OSCE-G1</code>…<code>OSCE-G4</code>, or <code>*</code>. One row per assignment is fine.</p>' +
        (data.signinConfigured ? '' : '<div class="banner warn small">Sign-in helper not configured: only users in the owner\'s Google Workspace domain can sign in. See README → Sign-in.</div>') +
        '<button class="btn primary" id="addU">Add user</button></div>';
      html += '<div class="card"><div class="tablewrap"><table><thead><tr><th>E-mail</th><th>Name</th><th>Role</th><th>Day</th><th>Station</th><th>Active</th><th></th></tr></thead><tbody>' +
        data.users.map(function (u) { return '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.role) + '</td><td>' + esc(u.day) + '</td><td>' + esc(u.station) + '</td><td>' + esc(u.active) + '</td><td><button class="btn sm" data-u="' + u._row + '">Edit</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + (data.users.length ? '' : '<p class="muted">No users yet.</p>') + '</div>';
      // Staff named in the programme (from the seed) — to help the Admin add e-mails.
      html += '<div class="card"><h2>Station staff in the programme</h2><p class="small muted">Names from the seed. E-mails are not in the seed — add each person with their Google e-mail.</p>' +
        table(['Day', 'Station', 'Facilitator', 'Subject expert', 'Organizer'], S.ref.stations.map(function (s) { return [s.day, s.station, s.facilitator, s.subject_expert, s.organizer]; })) + '</div>';
      $('#adm').innerHTML = html;
      $('#addU').onclick = function () { userForm(null); };
      $$('[data-u]').forEach(function (b) { b.onclick = function () { userForm(data.users.filter(function (u) { return String(u._row) === b.getAttribute('data-u'); })[0]); }; });
    },
    roster: function () {
      $('#adm').innerHTML = '<div class="card"><h2>Import roster</h2><p class="small">CSV with header <code>participant_no,name,staff_id</code>. Only names and staff IDs are updated; groups and teams stay as in the seed. Unknown numbers are rejected.</p>' +
        '<input type="file" id="rf" accept=".csv,text/csv"><label class="f" for="rt">…or paste CSV</label><textarea id="rt" style="min-height:160px"></textarea>' +
        '<div class="row" style="margin-top:8px"><button class="btn" id="rp">Preview</button><button class="btn primary" id="ri" disabled>Import</button></div><div id="rres"></div></div>';
      $('#rf').onchange = function () { var f = this.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { $('#rt').value = r.result; }; r.readAsText(f); };
      $('#rp').onclick = function () {
        get('adminImportRoster', { csv: $('#rt').value, dryRun: true }).then(function (r) {
          $('#rres').innerHTML = (r.errors.length ? '<div class="banner err small">' + r.errors.map(esc).join('<br>') + '</div>' : '<div class="banner ok small">' + r.updates.length + ' rows ready.</div>') +
            table(['#', 'Name', 'Staff ID'], r.updates.map(function (u) { return [u.participant_no, u.name, u.staff_id]; }), { num: [0] });
          $('#ri').disabled = !!r.errors.length || !r.updates.length;
        }, function (e) { toast(e.message); });
      };
      $('#ri').onclick = function () { get('adminImportRoster', { csv: $('#rt').value }).then(function (r) { toast(r.imported + ' participants updated'); reloadRef(); }, function (e) { toast(e.message); }); };
    },
    settings: function (data) {
      $('#adm').innerHTML = '<div class="card"><h2>Settings</h2>' + data.config.map(function (c) {
        return '<div style="margin-bottom:12px"><label class="f" for="cf_' + esc(c.key) + '"><b>' + esc(c.key) + '</b> — ' + esc(c.note) + '</label><div class="row"><input type="text" id="cf_' + esc(c.key) + '" value="' + esc(c.value) + '" style="flex:1"><button class="btn sm" data-k="' + esc(c.key) + '">Save</button></div></div>';
      }).join('') + '</div>';
      $$('[data-k]').forEach(function (b) {
        b.onclick = function () {
          var k = b.getAttribute('data-k');
          get('adminSetConfig', { key: k, value: $('#cf_' + k).value }).then(function () { toast('Saved ' + k); reloadRef(); }, function (e) { toast(e.message); });
        };
      });
    },
    readiness: function (data) {
      var opts = [];
      ['2', '3'].forEach(function (d) { ['A', 'B', 'C', 'D'].forEach(function (s) { opts.push([d + '|' + s, 'Day ' + d + ' · Station ' + s]); }); });
      $('#adm').innerHTML = '<div class="card"><h2>Station readiness ticklists</h2><p class="small muted">Enter items from the equipment checklist document, one per line. Nothing is pre-filled.</p>' +
        '<select id="rs">' + opts.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select>' +
        '<textarea id="rl" style="min-height:220px;margin-top:8px"></textarea><button class="btn primary" id="rsv" style="margin-top:8px">Save list</button></div>';
      function fill() { var x = $('#rs').value.split('|'); $('#rl').value = data.readinessItems.filter(function (i) { return i.day === x[0] && i.station === x[1]; }).map(function (i) { return i.item; }).join('\n'); }
      $('#rs').onchange = fill; fill();
      $('#rsv').onclick = function () {
        var x = $('#rs').value.split('|');
        get('adminSetReadinessItems', { day: x[0], station: x[1], text: $('#rl').value }).then(function (r) { toast(r.saved + ' items saved'); render(); }, function (e) { toast(e.message); });
      };
    },
    seed: function () {
      $('#adm').innerHTML = '<p class="muted">Checking the sheet against the seed…</p>';
      get('adminSeedCheck', {}).then(function (r) {
        var c = r.counts;
        $('#adm').innerHTML = '<div class="card"><h2>Seed check ' + (r.ok ? '<span class="st finalised">✔ Pass</span>' : '<span class="st unlocked">Problems found</span>') + '</h2>' +
          table(['Check', 'Value'], [['Checklists', c.checklists], ['Total items', c.totalItems]].concat(['A1', 'B1', 'C1', 'C2', 'TA', 'TB', 'TC', 'TD'].map(function (k) { return [k + ' items', c[k]]; }))
            .concat([['OSCE scenarios', c.osces], ['Roster', c.roster]]), { num: [1] }) +
          (r.seedErrors.length ? '<div class="banner err small">' + r.seedErrors.map(esc).join('<br>') + '</div>' : '') +
          (r.sheetMismatches.length ? '<div class="banner err small">' + r.sheetMismatches.map(esc).join('<br>') + '</div>' : '<p class="small">Every checklist and OSCE text in the sheet equals the seed, character for character.</p>') +
          (r.seedIssues.length ? '<h3>Notes</h3><ul class="small">' + r.seedIssues.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      }, errorView);
    },
    export: function () {
      var t = ['Assessments', 'AssessmentScores', 'OSCEAssessments', 'OSCEScores', 'TeamRubric', 'Attendance', 'AuditLog', 'Participants', 'Users', 'v_assessments', 'v_item_scores', 'v_osce', 'v_rubric'];
      $('#adm').innerHTML = '<div class="card"><h2>Export raw tables (CSV)</h2><div class="grid two">' + t.map(function (n) { return '<button class="btn" data-x="' + n + '">' + n + '</button>'; }).join('') + '</div>' +
        '<p class="small muted">v_* tabs are flat views for Looker Studio; they are rebuilt every 5 minutes by refreshViews().</p></div>';
      $$('[data-x]').forEach(function (b) { b.onclick = function () { var n = b.getAttribute('data-x'); get('exportTable', { table: n }).then(function (r) { download(n + '.csv', r.csv); }, function (e) { toast(e.message); }); }; });
    }
  };
  function userForm(u) {
    u = u || { email: '', name: '', role: 'facilitator', day: '', station: '', active: 'true' };
    var m = modal('<h2>' + (u._row ? 'Edit user' : 'Add user') + '</h2>' +
      '<label class="f" for="ue">Google e-mail</label><input type="email" id="ue" value="' + esc(u.email) + '">' +
      '<label class="f" for="un">Name</label><input type="text" id="un" value="' + esc(u.name) + '">' +
      '<label class="f" for="ur">Role</label><select id="ur">' + ['admin', 'station_leader', 'facilitator', 'organizer'].map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' +
      '<label class="f" for="ud">Day(s)</label><input type="text" id="ud" value="' + esc(u.day) + '" placeholder="2  or  2,3  or  *">' +
      '<label class="f" for="us">Station(s)</label><input type="text" id="us" value="' + esc(u.station) + '" placeholder="A  or  OSCE  or  OSCE-G1">' +
      '<label class="toggle"><input type="checkbox" id="ua"' + (u.active !== 'false' ? ' checked' : '') + '> Active</label>' +
      '<div class="row" style="margin-top:12px"><button class="btn" data-close>Cancel</button><span class="spacer"></span><button class="btn primary" id="usv">Save</button></div>');
    $('#usv', m).onclick = function () {
      get('adminSaveUser', { row: u._row, user: { email: $('#ue', m).value, name: $('#un', m).value, role: $('#ur', m).value, day: $('#ud', m).value, station: $('#us', m).value, active: $('#ua', m).checked } })
        .then(function () { closeModal(); toast('Saved'); render(); }, function (e) { toast(e.message); });
    };
  }
  function reloadRef() {
    rpc('bootstrap', {}).then(function (res) { if (res.ok) { S.ref = res.data.ref; S.cfg = res.data.config; S.access = res.data.access; buildIndex(); } });
  }

  // expose for the preview harness / debugging only
  window.ENCOR = { S: S, go: go, flush: flush };
  boot();
})();
</script>
