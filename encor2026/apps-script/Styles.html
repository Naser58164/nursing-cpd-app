<style>
/* ENCOR 2026 — mobile-first styles. Tokens first; dark mode is its own selected set. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --border: rgba(11,11,11,.12);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68; --grid: #e1e0d9; --axis: #c3c2b7;
  --accent: #1c5cab; --accent-ink: #ffffff; --accent-soft: #cde2fb;
  --series-1: #2a78d6;
  --s2: #104281; --s1: #2a78d6; --s0: #86b6ef; --s2-ink: #ffffff; --s1-ink: #ffffff; --s0-ink: #0b0b0b;
  --good: #006300; --good-bg: #e3f3e3; --warn: #7a5200; --warn-bg: #fdf0d3; --crit: #b42828; --crit-bg: #fbe4e4;
  --radius: 12px; --tap: 48px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --border: rgba(255,255,255,.12);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b; --grid: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --accent-ink: #0b0b0b; --accent-soft: #1c3557;
    --series-1: #3987e5;
    --s2: #9ec5f4; --s1: #3987e5; --s0: #184f95; --s2-ink: #0b0b0b; --s1-ink: #0b0b0b; --s0-ink: #ffffff;
    --good: #0ca30c; --good-bg: #13291a; --warn: #fab219; --warn-bg: #33270b; --crit: #e66767; --crit-bg: #3a1717;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --border: rgba(255,255,255,.12);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b; --grid: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --accent-ink: #0b0b0b; --accent-soft: #1c3557;
  --series-1: #3987e5;
  --s2: #9ec5f4; --s1: #3987e5; --s0: #184f95; --s2-ink: #0b0b0b; --s1-ink: #0b0b0b; --s0-ink: #ffffff;
  --good: #0ca30c; --good-bg: #13291a; --warn: #fab219; --warn-bg: #33270b; --crit: #e66767; --crit-bg: #3a1717;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--page); color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.25rem; } h2 { font-size: 1.1rem; } h3 { font-size: 1rem; }
p { margin: .25rem 0 .75rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: .5rem; padding: .5rem 16px; min-height: 56px; }
.top .title { flex: 1; min-width: 0; }
.top .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .title span { display: block; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { min-width: 44px; min-height: 44px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; cursor: pointer; }
.badge-sync { border: 1px solid var(--border); border-radius: 999px; padding: .25rem .6rem; font-size: .78rem; white-space: nowrap; background: var(--surface-2); cursor: pointer; }
.badge-sync.ok { color: var(--good); background: var(--good-bg); }
.badge-sync.wait { color: var(--warn); background: var(--warn-bg); }
.badge-sync.err { color: var(--crit); background: var(--crit-bg); }

main { max-width: 960px; margin: 0 auto; padding: 16px 16px 120px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: repeat(3, 1fr); } }
.tile { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; min-height: var(--tap); cursor: pointer; }
.tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; }
.tile .k { font-weight: 700; }
.tile .d { color: var(--ink-2); font-size: .9rem; margin-top: .2rem; }
.row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

.btn { min-height: var(--tap); padding: .6rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: .3rem .7rem; font-size: .9rem; }

.chips { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .25rem; scrollbar-width: thin; }
.chip { flex: 0 0 auto; min-height: 44px; padding: .4rem .8rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; }
.chip small { display: block; color: var(--muted); font-size: .75rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] small { color: inherit; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list button.item { width: 100%; display: flex; align-items: center; gap: .6rem; padding: .7rem .25rem; min-height: var(--tap); background: none; border: 0; text-align: left; cursor: pointer; }
.list .no { font-weight: 700; min-width: 2.6rem; font-variant-numeric: tabular-nums; }
.list .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }

.st { display: inline-flex; align-items: center; gap: .25rem; font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); }
.st.not_started { color: var(--muted); }
.st.draft, .st.pending, .st.unlocked { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.st.submitted, .st.mine { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.st.finalised { color: var(--good); background: var(--good-bg); border-color: transparent; }

/* Scoring */
.item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.item.unscored { border-left: 4px solid var(--warn); }
.item .q { display: flex; gap: .5rem; margin-bottom: .6rem; }
.item .q b { min-width: 1.8rem; font-variant-numeric: tabular-nums; }
.item .q span { overflow-wrap: anywhere; white-space: pre-wrap; }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.score { min-height: 56px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; padding: .3rem; line-height: 1.15; }
.score b { display: block; font-size: 1.3rem; }
.score small { display: block; font-size: .72rem; color: var(--ink-2); }
.score[aria-pressed="true"] { border-color: var(--ink); }
.score[aria-pressed="true"][data-v="2"] { background: var(--s2); color: var(--s2-ink); }
.score[aria-pressed="true"][data-v="1"] { background: var(--s1); color: var(--s1-ink); }
.score[aria-pressed="true"][data-v="0"] { background: var(--s0); color: var(--s0-ink); }
.score[aria-pressed="true"] small { color: inherit; }
.score:disabled { cursor: default; }
.totalbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.totalbar .inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: .75rem; }
.totalbar .t { flex: 1; min-width: 0; }
.totalbar .t b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }

textarea, input[type=text], input[type=email], input[type=number], input[type=search], select {
  width: 100%; min-height: 44px; padding: .55rem .7rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; font-size: .85rem; color: var(--ink-2); margin: .5rem 0 .25rem; }
.toggle { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; }

details.info { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; }
details.info summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.timeline { list-style: none; padding: 0; margin: .5rem 0 0; }
.timeline li { display: grid; grid-template-columns: 3.2rem 1fr; gap: .5rem; padding: .35rem 0; border-top: 1px solid var(--border); }
.timeline li span { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Tables */
.tablewrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.progress td { text-align: center; padding: .3rem .25rem; font-size: .8rem; }
.progress td.p { text-align: left; white-space: nowrap; }
.cell { display: inline-block; min-width: 1.8rem; border-radius: 6px; padding: .1rem .2rem; }
.cell.finalised { background: var(--good-bg); color: var(--good); }
.cell.submitted { background: var(--accent-soft); color: var(--accent); }
.cell.not_started { color: var(--muted); }

/* Dashboard */
.tabs { display: flex; gap: .25rem; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tab { flex: 0 0 auto; min-height: 44px; padding: .4rem .8rem; border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
@media (min-width: 720px) { .filters { grid-template-columns: repeat(5, 1fr); } }
.filters label { font-size: .75rem; color: var(--muted); display: block; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.kpi .v { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--ink-2); }
.chartbox { position: relative; width: 100%; height: 260px; }
.chartbox.tall { height: 420px; }
.legend { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); margin: .25rem 0 .5rem; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: .3rem; }
.notset { border: 1px dashed var(--axis); border-radius: var(--radius); padding: 1rem; text-align: center; color: var(--ink-2); }

/* Modal + toast */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px 16px; }
@media (min-width: 640px) { .modal { border-radius: 16px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; z-index: 60; background: var(--ink); color: var(--page); padding: .6rem 1rem; border-radius: 10px; max-width: calc(100% - 32px); }
.banner { border-radius: 10px; padding: .7rem .9rem; margin-bottom: 12px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.err { background: var(--crit-bg); color: var(--crit); }
.banner.ok { background: var(--good-bg); color: var(--good); }
.center { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; flex-direction: column; }

@media print {
  .top, .tabs, .filters, .noprint, .totalbar { display: none !important; }
  body, .card, .kpi { background: #fff !important; color: #000 !important; }
  main { padding: 0; max-width: none; }
  .chartbox { break-inside: avoid; }
}
</style>
